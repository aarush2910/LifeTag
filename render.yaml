services:
  - type: web
    name: lifetag-backend
    env: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: cd fastapi && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALGORITHM
        value: HS256
      - key: SECRET_KEY
        generateValue: true
